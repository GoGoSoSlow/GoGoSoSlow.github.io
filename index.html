<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>UPS 5s and 10s</title>
<style>
  :root {
    --asphalt: #16191c;
    --panel: #202429;
    --panel2: #262b31;
    --line: #34393f;
    --amber: #f2a900;
    --amber-dim: #7a5a10;
    --green: #4caf6d;
    --red: #d9534f;
    --text: #e9e7e0;
    --text-dim: #9a9da2;
    --text-dim2: #9198a0;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html {
    font-size: 118%; /* base scale, adjusted live via --font-scale below */
  }
  html, body {
    margin: 0; padding: 0;
    background: var(--asphalt);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  body {
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 78px, rgba(242,169,0,0.035) 78px, rgba(242,169,0,0.035) 82px);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; justify-content: space-between;
    border-bottom: 2px solid var(--amber);
    padding-bottom: 12px; margin-bottom: 18px;
  }
  header.top h1 {
    font-family: var(--mono);
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0;
    color: var(--amber);
  }
  header.top .sub {
    font-size: 0.7rem;
    color: var(--text-dim2);
    font-family: var(--mono);
    white-space: nowrap;
  }
  .font-ctrl {
    display: flex; align-items: center; gap: 6px;
    order: 3; width: 100%;
  }
  .font-ctrl .fc-label {
    font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim2); margin-right: 2px;
  }
  .font-ctrl button {
    background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    width: 34px; height: 34px; border-radius: 4px; font-size: 1rem; cursor: pointer;
    font-family: inherit; line-height: 1;
  }
  .font-ctrl button:active { background: var(--amber-dim); }
  .font-ctrl .fc-pct {
    font-family: var(--mono); font-size: 0.75rem; color: var(--text); min-width: 40px; text-align: center;
  }
  .font-ctrl .fc-reset {
    font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim2);
    text-decoration: underline; background: none; border: none; cursor: pointer;
    width: auto; height: auto; margin-left: 4px;
  }
  @media (min-width: 560px) {
    .font-ctrl { order: 0; width: auto; }
  }

  nav.modes {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 18px;
  }
  nav.modes button {
    flex: 1 1 auto;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim2);
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 10px 6px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 90px;
  }
  nav.modes button:hover { border-color: var(--amber-dim); color: var(--text); }
  nav.modes button.active {
    background: var(--amber);
    color: #1a1400;
    border-color: var(--amber);
    font-weight: 700;
  }

  .scope-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .scope-label {
    font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim2);
  }
  .scope-toggle {
    display: flex; gap: 4px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 3px;
  }
  .scope-toggle button {
    background: transparent; border: none; color: var(--text-dim2);
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.03em;
    padding: 7px 12px; border-radius: 16px; cursor: pointer;
  }
  .scope-toggle button.active {
    background: var(--amber); color: #1a1400; font-weight: 700;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 14px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 8px;
  }

  .flash-face {
    min-height: 130px;
    display: flex; flex-direction: column; justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
    padding: 10px 0;
  }
  .flash-title {
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1.3;
  }
  .flash-hint { font-size: 0.75rem; color: var(--text-dim2); margin-top: 14px; font-family: var(--mono);}
  .flash-back { text-align: left; }
  .flash-back .row { margin-bottom: 12px; }
  .flash-back .lbl {
    font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim2); margin-bottom: 3px;
  }
  .flash-back .val { line-height: 1.5; font-size: 0.95rem; }
  .flash-back .val.key { color: var(--amber); font-weight: 700; }

  .btnrow { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    flex: 1;
    border: none; border-radius: 4px;
    padding: 12px; font-size: 0.85rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    letter-spacing: 0.02em;
  }
  .btn.primary { background: var(--amber); color: #1a1400; }
  .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .btn.miss { background: rgba(217,83,79,0.15); color: var(--red); border: 1px solid var(--red); }
  .btn.got { background: rgba(76,175,109,0.15); color: var(--green); border: 1px solid var(--green); }
  .btn:disabled { opacity: 0.4; cursor: default; }

  textarea.answer {
    width: 100%; min-height: 110px;
    background: var(--asphalt); color: var(--text);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 12px; font-size: 0.95rem; line-height: 1.5;
    font-family: inherit; resize: vertical;
  }
  textarea.answer:focus { outline: none; border-color: var(--amber); }

  .diff-line { line-height: 1.9; font-size: 0.95rem; margin-top: 4px;}
  .diff-line .ok { color: var(--green); }
  .diff-line .bad { color: var(--red); text-decoration: line-through; text-decoration-color: rgba(217,83,79,0.6); }
  .diff-line .miss { color: var(--amber); border-bottom: 1px dotted var(--amber); }

  .score-badge {
    display: inline-block; font-family: var(--mono); font-weight: 700;
    padding: 4px 10px; border-radius: 3px; font-size: 0.85rem;
  }

  .cloze-text { line-height: 2.1; font-size: 0.98rem; }
  .cloze-heading {
    color: var(--amber);
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .cloze-input {
    background: var(--asphalt); border: none; border-bottom: 2px solid var(--amber);
    color: var(--text); font-family: inherit; font-size: 0.95rem;
    padding: 2px 4px; width: auto; min-width: 60px; text-align: center;
  }
  .cloze-input.correct { border-bottom-color: var(--green); color: var(--green); }
  .cloze-input.incorrect { border-bottom-color: var(--red); color: var(--red); }
  .cloze-input:disabled { opacity: 1; }

  .cloze-check {
    display: inline-block;
    padding: 1px 5px;
    border-bottom: 2px solid;
    font-family: inherit; font-size: 0.95rem;
    border-radius: 2px;
  }
  .cloze-check.ok { color: var(--green); border-bottom-color: var(--green); }
  .cloze-check.incorrect {
    color: var(--red); border-bottom-color: var(--red);
    cursor: pointer;
  }
  .cloze-check.incorrect::after {
    content: '↻';
    font-size: 0.7em;
    margin-left: 3px;
    opacity: 0.6;
  }
  .cloze-check.ok.was-wrong::after {
    content: '↻';
    font-size: 0.7em;
    margin-left: 3px;
    opacity: 0.6;
    cursor: pointer;
  }

  .order-list { list-style: none; padding: 0; margin: 0; }
  .order-item {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
    padding: 10px 12px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 0.9rem;
  }
  .order-item .num {
    font-family: var(--mono); color: var(--amber); font-weight: 700; min-width: 22px;
  }
  .order-item .item-title { flex: 1 1 160px; min-width: 0; }
  .order-item .arrows { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
  .order-item .arrows button {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 3px; width: 28px; height: 28px; cursor: pointer; font-size: 0.9rem;
  }
  .order-item.correct { border-color: var(--green); background: rgba(76,175,109,0.08); }
  .order-item.incorrect { border-color: var(--red); background: rgba(217,83,79,0.08); }

  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.progress { width: 100%; min-width: 380px; border-collapse: collapse; font-size: 0.85rem; }
  table.progress th {
    text-align: left; font-family: var(--mono); font-size: 0.65rem;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim2);
    padding: 6px 4px; border-bottom: 1px solid var(--line);
  }
  table.progress td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .bar-track { background: var(--asphalt); border-radius: 3px; height: 8px; width: 100%; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--amber); }
  .sec-label {
    font-family: var(--mono); font-size: 0.65rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim2); margin: 20px 0 6px;
  }

  .helptext { font-size: 0.82rem; color: var(--text-dim2); line-height: 1.5; margin-bottom: 14px; }
  .why-tag { font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim2); margin-top: 10px;}
  .why-tag b { color: var(--amber); }

  .settings-btn {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    width: 36px; height: 36px; border-radius: 4px; cursor: pointer;
    font-size: 1.1rem; line-height: 1; flex-shrink: 0; order: 1;
  }
  .settings-btn:active { background: var(--amber-dim); }

  .settings-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.6);
    align-items: flex-start; justify-content: center;
    padding: 40px 16px;
    overflow-y: auto;
  }
  .settings-overlay.open { display: flex; }
  .settings-panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 20px; width: 100%; max-width: 440px;
  }
  .settings-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .settings-panel-header h2 {
    font-family: var(--mono); font-size: 0.9rem; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--amber); margin: 0;
  }
  .settings-close {
    background: none; border: none; color: var(--text-dim2);
    font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 2px 6px;
  }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .settings-row-text { flex: 1; }
  .settings-row .settings-row-title { font-weight: 700; font-size: 0.92rem; }
  .settings-row .settings-row-desc { font-size: 0.78rem; color: var(--text-dim2); margin-top: 2px; }
  .settings-row .btn { flex: none; width: auto; padding: 9px 14px; font-size: 0.8rem; }
  .settings-storage-note {
    font-family: var(--mono); font-size: 0.65rem; color: var(--text-dim2);
    margin-top: 14px; line-height: 1.5;
  }

  .reset-link {
    font-family: var(--mono); font-size: 0.7rem; color: var(--text-dim2);
    text-decoration: underline; cursor: pointer; background: none; border: none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>UPS 5s and 10s</h1>
    <div class="sub" id="streakDisplay">loading…</div>
    <button class="settings-btn" id="settingsBtn" aria-label="Settings">⚙</button>
    <div class="font-ctrl">
      <span class="fc-label">Text size</span>
      <button id="fcMinus" aria-label="Decrease text size">A−</button>
      <span class="fc-pct" id="fcPct">100%</span>
      <button id="fcPlus" aria-label="Increase text size">A+</button>
      <button class="fc-reset" id="fcReset">reset</button>
    </div>
  </header>

  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <div class="settings-panel-header">
        <h2>Settings</h2>
        <button class="settings-close" id="settingsClose" aria-label="Close settings">&times;</button>
      </div>
      <div class="settings-row">
        <div class="settings-row-text">
          <div class="settings-row-title">Reset progress</div>
          <div class="settings-row-desc">Clears mastery levels for every habit and point. Text size and quiz scope are kept.</div>
        </div>
        <button class="btn miss" id="settingsResetProgress">Reset</button>
      </div>
      <div class="settings-storage-note" id="storageNote"></div>
    </div>
  </div>

  <nav class="modes">
    <button data-mode="flash" class="active">Flashcards</button>
    <button data-mode="cloze">Fill-in</button>
    <button data-mode="type">Type it out</button>
    <button data-mode="order">Order test</button>
    <button data-mode="progress">Progress</button>
  </nav>

  <div class="scope-row">
    <span class="scope-label">Quiz on</span>
    <div class="scope-toggle" id="scopeToggle">
      <button data-scope="habits">5 Seeing Habits</button>
      <button data-scope="points">10 Point Commentary</button>
      <button data-scope="both" class="active">Both</button>
    </div>
  </div>

  <div id="app"></div>
</div>

<script>
// ---------- DATA ----------
const fiveHabits = [
  { id: "h0", name: "AIM HIGH IN STEERING",
    how: "Imaginary target – baseball/dartboard",
    what: "Centers car in traffic lane: Safe path on turns",
    key: "FIND A SAFE PATH WELL AHEAD." },
  { id: "h1", name: "GET THE BIG PICTURE",
    how: "How wide and deep? What's in it? Objects and ground.",
    what: "Keeps you away from billboards. Smooth stops and turns. Buys time",
    key: "STAY BACK AND SEE IT ALL" },
  { id: "h2", name: "KEEP YOUR EYES MOVING",
    how: "Move eyes. Front – 2 seconds, Rear – 5 to 8 seconds",
    what: "Keeps you alive at intersections, keeps eyes ahead of car",
    key: "SCAN – DON'T STARE" },
  { id: "h3", name: "LEAVE YOURSELF AN OUT",
    how: "Have escape route, take path of least resistance.",
    what: "Space on all four sides, but always in front",
    key: "BE PREPARED, EXPECT THE UNEXPECTED" },
  { id: "h4", name: "MAKE SURE THEY SEE YOU",
    how: "Communicate in traffic – horn, lights, signals",
    what: "Establishes eye-to-eye contact",
    key: "DON'T GAMBLE – USE YOUR HORN, LIGHTS, AND SIGNALS" }
];

const tenPoints = [
  { id: "p0", title: "Clearing intersections", why: "Keeps you alive at intersections.",
    text: "Whether approaching, turning, going through, or starting up at intersections scan ahead, look left, right, then back to the left. Scan your driving scene getting the big picture and look left, right, first, looking for any pedestrians, bicycles, motorcycles, and vehicles to ensure they are obeying their traffic sign or signal, and looking for any obstructions that may block your visibility. Look left the second time because that's the first lane of traffic I'm going to enter. Prior to entering the intersection, I check my traffic side mirror looking for traffic in the lane next to my vehicle that may turn in front of me. As I proceed through the intersection I check my opposite traffic side mirror to ensure I cleared the intersection of any hazards." },
  { id: "p1", title: "When stopped in traffic", why: "Have escape route.",
    text: "When stopped in traffic, I leave enough space between the front bumper of my vehicle and the rear bumper of the vehicle in front of me. If that vehicle stalls or becomes disabled, I can maneuver around that vehicle without having to back up in traffic. The space I leave in front of my vehicle is proportionate to the size of my vehicle. The longer my vehicle, the more space required." },
  { id: "p2", title: "Count one-two-three after vehicle ahead has started to move", why: "Keeps you away from billboards.",
    text: "Count one, two, three after the vehicle ahead has started to move before placing my vehicle in motion. This will automatically establish a space cushion and allow me to bring my eyes up to the driving scene ahead." },
  { id: "p3", title: "Four to six second following time for speeds up to 30 MPH, 6-8 seconds for speeds over 30 MPH", why: "Buys time.",
    text: "To calculate following distance- When the vehicle ahead passes a stationary item, start counting 1/1000 one, 1/1000 two, 1/1000 three until the front bumper of my vehicle reaches that item. This is my following distance in seconds and gives me time to act to any changes in the traffic scene ahead." },
  { id: "p4", title: "Eight to twelve seconds eye-lead time", why: "Centers car in traffic lane.",
    text: "Eight to twelve seconds of eye lead time is the depth of which my eyes should be most of the time while driving. To establish eye lead time while driving, I pick a stationary item in front of my vehicle and start counting 1/1000 one, 1/1000 two, 1/1000 three until the front of my vehicle reaches that item. That is my eye lead time in seconds. Remember that it is a maintained depth of vision." },
  { id: "p5", title: "Scan steering wheels", why: "Take path of least resistance.",
    text: "Always scan steering wheels of parked cars to see if the vehicle is occupied. An occupied vehicle presents two hazards, the person may either exit the vehicle, or pull away from the curb. Other ways to see if the vehicle is occupied is steering wheels turned out, tail or brake lights on, and exhaust coming from the tail pipe. If you can't determine if the vehicle is occupied, treat it as an occupied vehicle. A small tap or loud blast if necessary, close enough to be heard, yet far enough away to take evasive action." },
  { id: "p6", title: "Stale green lights", why: "Smooth stops and turns.",
    text: "A stale green light is a light that I did not see change, and I'm not sure when it may turn to yellow or red. A point of decision must be established between the front bumper of my vehicle and the stop line. If the light would change before reaching my decision point I will be able to bring the vehicle to a safe stop behind the stop line. If I reach my decision point and the light would change, I will continue through the intersection without hesitation or acceleration. Things that affect my point of decision are road, load, weather and speed." },
  { id: "p7", title: "Eye contact", why: "Establishes eye to eye contact.",
    text: "Always establish eye to eye contact with pedestrians, bicycles, motorcycles, and vehicles to eliminate uncertainty. We use 3 tools to establish eye to eye contact, our horn, lights and signals. Our horn is the primary tool, usually a tap of the horn, sometimes a loud blast is necessary. Once I establish eye to eye contact I can expect the other person to act in a reasonable and predictable manner." },
  { id: "p8", title: "Pulling from curb", why: "Communicate in traffic, horn, lights, signals.",
    text: "When pulling from a curb, I always indicate my intentions by turning on my traffic side turn signal. I check traffic by, looking at my traffic side flat and convex mirrors. I look over my traffic side shoulder to check my blind spot between the fuel t
