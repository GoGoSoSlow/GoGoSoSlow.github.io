<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>UPS Pretrip Practice</title>
<style>
  :root {
    --asphalt: #16191c;
    --panel: #202429;
    --panel2: #262b31;
    --line: #34393f;
    --amber: #f2a900;
    --green: #4caf6d;
    --red: #d9534f;
    --text: #e9e7e0;
    --text-dim2: #9198a0;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  html { font-size: 118%; }
  html, body {
    margin: 0; padding: 0;
    background: var(--asphalt);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  body {
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 78px, rgba(242,169,0,0.035) 78px, rgba(242,169,0,0.035) 82px);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }

  header.top {
    border-bottom: 2px solid var(--amber);
    padding-bottom: 12px; margin-bottom: 18px;
  }
  header.top h1 {
    font-family: var(--mono);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--amber);
  }
  header.top .sub {
    font-size: 0.7rem;
    color: var(--text-dim2);
    font-family: var(--mono);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 12px;
  }
  .pretrip-img {
    display: block;
    width: 100%;
    max-height: 340px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .section-title {
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 14px;
  }
  ul.check-list {
    list-style: none;
    margin: 0; padding: 0;
  }
  ul.check-list li {
    padding: 8px 0 8px 22px;
    border-bottom: 1px solid var(--line);
    font-size: 1rem;
    line-height: 1.4;
    position: relative;
  }
  ul.check-list li:last-child { border-bottom: none; }
  ul.check-list li::before {
    content: "›";
    position: absolute; left: 0; top: 7px;
    color: var(--amber);
    font-weight: 700;
  }

  .btnrow { display: flex; gap: 8px; margin-top: 18px; }
  .btn {
    flex: 1;
    border: none; border-radius: 4px;
    padding: 13px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .btn.primary { background: var(--amber); color: #1a1400; }
  .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .btn.miss { background: rgba(217,83,79,0.15); color: var(--red); border: 1px solid var(--red); }
  .btn.got { background: rgba(76,175,109,0.15); color: var(--green); border: 1px solid var(--green); }

  .nav-row { display: flex; gap: 8px; margin-top: 14px; }
  .nav-row .btn { font-size: 0.78rem; padding: 10px; }

  .helptext { font-size: 0.82rem; color: var(--text-dim2); line-height: 1.5; }

  .score-badge {
    display: inline-block; font-family: var(--mono); font-weight: 700;
    padding: 4px 10px; border-radius: 3px; font-size: 0.9rem;
  }
  .report-list { list-style: none; padding: 0; margin: 14px 0 0; }
  .report-item {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 4px;
    padding: 12px 14px; margin-bottom: 8px;
    font-size: 0.88rem; line-height: 1.4;
  }
  .report-item.correct { border-color: var(--green); background: rgba(76,175,109,0.08); }
  .report-item.incorrect { border-color: var(--red); background: rgba(217,83,79,0.08); }
  .report-item .report-header {
    display: flex; align-items: baseline; gap: 8px;
    font-weight: 700; margin-bottom: 6px;
  }
  .report-item .icon { font-weight: 700; flex-shrink: 0; }
  .report-item ul.check-list { margin-top: 2px; }
  .report-item ul.check-list li { padding: 5px 0 5px 20px; font-size: 0.85rem; }

  .top-actions { display:flex; gap:8px; margin-top:10px; }
  .top-actions .btn { padding:8px 10px; font-size:0.72rem; flex:0 0 auto; }
  .editor-section { background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:12px; margin-bottom:12px; }
  .editor-title { font-weight:700; margin-bottom:10px; line-height:1.3; }
  .editor-item { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start; padding:8px 0; border-top:1px solid var(--line); }
  .editor-item:first-of-type { border-top:none; }
  .item-text { width:100%; min-height:62px; resize:vertical; background:var(--asphalt); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:9px; font:inherit; line-height:1.35; }
  .item-actions { display:grid; grid-template-columns:repeat(2, 38px); gap:5px; }
  .mini-btn { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:4px; min-height:34px; cursor:pointer; font-weight:700; }
  .mini-btn.delete { color:var(--red); border-color:rgba(217,83,79,.55); }
  .move-row { grid-column:1 / -1; display:flex; gap:7px; align-items:center; }
  .move-row select { flex:1; min-width:0; background:var(--asphalt); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:8px; }
  .editor-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .editor-toolbar .btn { flex:1 1 130px; }
  .status-note { margin:8px 0 14px; padding:9px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:4px; font-size:.78rem; color:var(--text-dim2); }
  .add-item { width:100%; margin-top:8px; }
  .file-input { display:none; }
  @media (max-width:480px) {
    .editor-item { grid-template-columns:1fr; }
    .item-actions { grid-template-columns:repeat(4, 1fr); }
    .move-row { grid-column:auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>UPS Pretrip Practice</h1>
    <div class="sub" id="progressLabel">loading…</div>
    <div class="top-actions"><button class="btn ghost" id="btnEditMode">Edit checklist</button></div>
  </header>
  <div id="app"></div>
</div>

<script>
// ---------- DATA ----------
// Each card is one physical location/process from the pretrip. Sections are always
// worked in strict sequence — this is a fixed walk-around, not something to randomize.
const defaultCards = [
  { title: "Approach vehicle", items: [
    "No Pooling Liquids",
    "Check Oil & Water"
  ]},
  { title: "Get in passenger side, 3 pts contact", items: [
    "Hazard Triangles",
    "Hazmat Papers",
    "Hazmat Book",
    "Hazmat Sticker",
    "Charged Fire Extinguisher",
    "Check DVIR"
  ]},
  { title: "Sit in driver seat", items: [
    "Glass is Clean, not Cracked or Broken",
    "Mirrors Adjusted",
    "(Turn On Headlights) Low Beams, High Beams, (Turn On) 4-Way Flashers"
  ]},
  { title: "Get out, 3 pts contact", items: [
    "Check steering wheel for Excessive Play",
    "(Start at the Top) Mirror Bracket",
    "Vehicle Number",
    "Side Marker Light",
    "Hood Latch",
    "Front Tire Check (4/32 tread, pressure, cuts, lugs, stem/caps)"
  ]},
  { title: "Move around front, starting at top", items: [
    "Clearance Lights",
    "Vehicle Number",
    "Blinker Light & Lens, Headlight & Lens",
    "Bumper",
    "Headlight & Lens, Blinker Light & Lens"
  ]},
  { title: "Move to passenger front", items: [
    "Mirror Bracket",
    "Hood Latch",
    "Side Marker Light",
    "Vehicle Number",
    "Front Tire Check (4/32 tread, pressure, cuts, lugs, stem/caps)"
  ]},
  { title: "Passenger door", items: [
    "(Check and close Side Door) Glass Clean, not Cracked or Broken (Latch Open)"
  ]},
  { title: "Z-scan passenger side", items: [
    "No Cuts or Scratches Down to Bare Metal",
    "DOT Number (Bottom Right)",
    "Rear Tire Check (2/32 tread, pressure, cuts, lugs, stem/caps)",
    "Rear Marker Light (or Reflective Sticker or Both — Bottom Left Corner)"
  ]},
  { title: "Move to rear, start at top", items: [
    "Rear Marker Lights",
    "Camera Lens Adjusted & Not Cracked",
    "Vehicle Number (Top Left)",
    "No Cuts or Scratches Down to Bare Metal",
    "(Open Rear Door) Check Cables (Close Rear Door)",
    "(Step Back, Point to Both) Brake Lights & Lenses, Reverse Light Lenses",
    "License Plate & Light (Hold Hand Under Light), Rear Bumper"
  ]},
  { title: "Move to driver's side, Z-scan", items: [
    "(Side Wall Check) No Cuts or Scratches Down to Bare Metal",
    "Rear Tire Check (2/32 tread, pressure, cuts, lugs, stem/caps)",
    "Gas Cap (Twist to Tighten)",
    "DOT Number (Bottom Left)",
    "Rear Marker Light (or Reflective Sticker or Both — Bottom Right Corner)"
  ]},
  { title: "Driver's door check", items: [
    "(Pull Side Door) Glass Clean, not Cracked or Broken (Latch Open)"
  ]},
  { title: "Enter driver's door, 3 pts of contact, push fob once", items: [
    "Push Engine Start ONCE",
    "Buckle Seatbelt",
    "Foot on Brake, Start Vehicle",
    "Listen for Unusual Engine Noise (Keep Foot on Brake)",
    "Turn Off Headlights & 4-Way Flashers"
  ]},
  { title: "Cab Z-scan", items: [
    "Clearance Sticker, Rear Monitor Audio & Video Adjusted",
    "(Point to Gauges) Oil Pressure, Amp Meter, Speedometer, Water Temp, Fuel — working and reading normal",
    "Tap Horn",
    "Check Blinkers & Listen for Clicking"
  ]},
  { title: "Final step", items: [
    "Ebrake Test — shouldn't Move",
    "Regular Brake Test",
    "Check Reverse & Brake Lights Using the Buddy System or a Reflective Surface",
    "Log anything wrong in the DVIR"
  ]}
];

const STORAGE_KEY = 'upsPretripCustomItemsV1';
let cards = loadCards();

function cloneDefaults() {
  return defaultCards.map(c => ({ title: c.title, items: [...c.items] }));
}

function loadCards() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return cloneDefaults();
    const saved = JSON.parse(raw);
    if (!isValidImport(saved)) return cloneDefaults();
    return saved.sections.map((s, i) => ({ title: defaultCards[i].title, items: [...s.items] }));
  } catch (e) {
    return cloneDefaults();
  }
}

function saveCards() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(exportPayload()));
}

function exportPayload() {
  return {
    format: 'ups-pretrip-items',
    version: 1,
    exportedAt: new Date().toISOString(),
    sections: cards.map(c => ({ title: c.title, items: [...c.items] }))
  };
}

function isValidImport(data) {
  return !!data && data.format === 'ups-pretrip-items' && data.version === 1 &&
    Array.isArray(data.sections) && data.sections.length === defaultCards.length &&
    data.sections.every((s, i) => s && s.title === defaultCards[i].title && Array.isArray(s.items) &&
      s.items.every(x => typeof x === 'string'));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

// ---------- STATE ----------
let idx = 0;
let results = new Array(cards.length).fill(null);
let revealed = false;   // whether the text card is shown for the current section yet
let awaitingNext = false;
let finished = false;
let editing = false;

const app = document.getElementById('app');

function updateProgressLabel() {
  document.getElementById('progressLabel').textContent =
    editing ? 'Checklist editor' : (finished ? 'Run complete' : `Section ${idx + 1} of ${cards.length}`);
}

function render() {
  updateProgressLabel();
  document.getElementById('btnEditMode').textContent = editing ? 'Back to practice' : 'Edit checklist';
  if (editing) { renderEditor(); return; }
  if (finished) { renderReport(); return; }
  const card = cards[idx];
  const imgSrc = `${idx + 1}.jpg`;
  const imgHtml = `
    <img src="${imgSrc}" alt="Cue photo for section ${idx + 1}" class="pretrip-img" id="pretripImg"
         onerror="this.style.display='none'; var n=document.getElementById('imgMissingNote'); if(n) n.style.display='block';">
    <div class="helptext" id="imgMissingNote" style="display:none; margin-bottom:10px;">(No photo found for ${imgSrc} — make sure it's in the same folder as this page.)</div>
  `;

  let bodyHtml;
  if (!revealed) {
    bodyHtml = `
      ${imgHtml}
      <div class="btnrow"><button class="btn primary" id="btnReveal">Reveal</button></div>
    `;
  } else {
    const itemsHtml = card.items.map(t => `<li>${escapeHtml(t)}</li>`).join('');
    const buttonsHtml = awaitingNext
      ? `<div class="btnrow"><button class="btn primary" id="btnNext">Next section</button></div>`
      : `<div class="btnrow">
           <button class="btn miss" id="btnMiss">Missed it</button>
           <button class="btn got" id="btnGot">Got it</button>
         </div>`;
    bodyHtml = `
      ${imgHtml}
      <div class="section-title">${escapeHtml(card.title)}</div>
      <ul class="check-list">${itemsHtml}</ul>
      ${buttonsHtml}
    `;
  }

  app.innerHTML = `
    <div class="card" id="mainCard">
      <div class="eyebrow">Section ${idx + 1} of ${cards.length}</div>
      ${bodyHtml}
      <div class="nav-row">
        <button class="btn ghost" id="btnPrev">‹ Prev section</button>
        <button class="btn ghost" id="btnJumpNext">Next section ›</button>
      </div>
    </div>
    <div class="helptext">Look at the photo and say the section out loud from memory, then reveal to check. Prev/Next jump straight to a section if you want to drill just one part.</div>
  `;
  const mainCard = document.getElementById('mainCard');
  if (mainCard) mainCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const revealBtn = document.getElementById('btnReveal');
  const missBtn = document.getElementById('btnMiss');
  const gotBtn = document.getElementById('btnGot');
  const nextBtn = document.getElementById('btnNext');
  if (revealBtn) revealBtn.addEventListener('click', () => { revealed = true; render(); });
  if (missBtn) missBtn.addEventListener('click', () => record(false));
  if (gotBtn) gotBtn.addEventListener('click', () => record(true));
  if (nextBtn) nextBtn.addEventListener('click', advance);
  document.getElementById('btnPrev').addEventListener('click', () => goTo(idx - 1));
  document.getElementById('btnJumpNext').addEventListener('click', () => goTo(idx + 1));
}


function renderEditor() {
  const sectionOptions = cards.map((c, i) => `<option value="${i}">${i + 1}. ${escapeHtml(c.title)}</option>`).join('');
  const sectionsHtml = cards.map((card, sectionIndex) => {
    const itemsHtml = card.items.map((text, itemIndex) => `
      <div class="editor-item" data-section="${sectionIndex}" data-item="${itemIndex}">
        <textarea class="item-text" data-action="text">${escapeHtml(text)}</textarea>
        <div class="item-actions">
          <button class="mini-btn" data-action="up" title="Move up">↑</button>
          <button class="mini-btn" data-action="down" title="Move down">↓</button>
          <button class="mini-btn delete" data-action="delete" title="Delete item">×</button>
        </div>
        <div class="move-row">
          <select data-action="move-select" aria-label="Move item to section">${sectionOptions.replace(`value="${sectionIndex}"`, `value="${sectionIndex}" selected`)}</select>
          <button class="mini-btn" data-action="move">Move</button>
        </div>
      </div>`).join('');
    return `
      <div class="editor-section">
        <div class="editor-title">${sectionIndex + 1}. ${escapeHtml(card.title)}</div>
        <div>${itemsHtml || '<div class="helptext">No items in this section.</div>'}</div>
        <button class="btn ghost add-item" data-action="add" data-section="${sectionIndex}">+ Add item</button>
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="card">
      <div class="eyebrow">Customize checklist</div>
      <div class="editor-toolbar">
        <button class="btn ghost" id="btnExport">Export</button>
        <button class="btn ghost" id="btnImport">Import</button>
        <button class="btn ghost" id="btnResetDefaults">Reset defaults</button>
      </div>
      <input class="file-input" type="file" id="importFile" accept="application/json,.json">
      <div class="status-note" id="editorStatus">Changes save automatically on this device. Export a JSON file to move them to another device.</div>
      ${sectionsHtml}
    </div>`;

  app.querySelectorAll('.item-text').forEach(el => el.addEventListener('change', handleEditorAction));
  app.querySelectorAll('[data-action="up"],[data-action="down"],[data-action="delete"],[data-action="move"]').forEach(el => el.addEventListener('click', handleEditorAction));
  app.querySelectorAll('[data-action="add"]').forEach(el => el.addEventListener('click', handleEditorAction));
  document.getElementById('btnExport').addEventListener('click', exportChanges);
  document.getElementById('btnImport').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importChanges);
  document.getElementById('btnResetDefaults').addEventListener('click', resetDefaults);
}

function handleEditorAction(e) {
  const action = e.currentTarget.dataset.action;
  if (action === 'add') {
    const s = Number(e.currentTarget.dataset.section);
    cards[s].items.push('New item');
    saveCards(); render(); return;
  }
  const row = e.currentTarget.closest('.editor-item');
  const s = Number(row.dataset.section);
  const i = Number(row.dataset.item);
  if (action === 'text') {
    const value = e.currentTarget.value.trim();
    cards[s].items[i] = value || 'Untitled item';
  } else if (action === 'up' && i > 0) {
    [cards[s].items[i - 1], cards[s].items[i]] = [cards[s].items[i], cards[s].items[i - 1]];
  } else if (action === 'down' && i < cards[s].items.length - 1) {
    [cards[s].items[i + 1], cards[s].items[i]] = [cards[s].items[i], cards[s].items[i + 1]];
  } else if (action === 'delete') {
    if (!confirm('Delete this checklist item?')) return;
    cards[s].items.splice(i, 1);
  } else if (action === 'move') {
    const target = Number(row.querySelector('[data-action="move-select"]').value);
    if (target !== s) {
      const [item] = cards[s].items.splice(i, 1);
      cards[target].items.push(item);
    }
  }
  saveCards();
  render();
}

function exportChanges() {
  const blob = new Blob([JSON.stringify(exportPayload(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ups-pretrip-custom-checklist.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importChanges(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!isValidImport(data)) throw new Error('This file does not match this pretrip checklist.');
      cards = data.sections.map((s, i) => ({ title: defaultCards[i].title, items: [...s.items] }));
      saveCards();
      render();
      alert('Checklist imported successfully.');
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function resetDefaults() {
  if (!confirm('Reset every checklist item to the original defaults?')) return;
  cards = cloneDefaults();
  saveCards();
  render();
}

function goTo(target) {
  let t = target;
  if (t < 0) t = cards.length - 1;
  if (t >= cards.length) t = 0;
  idx = t;
  revealed = false;
  awaitingNext = false;
  finished = false;
  render();
}

function record(correct) {
  results[idx] = correct;
  awaitingNext = true;
  render();
}

function advance() {
  idx++;
  revealed = false;
  awaitingNext = false;
  if (idx >= cards.length) finished = true;
  render();
}

function renderReport() {
  const total = cards.length;
  const correctCount = results.filter(r => r === true).length;
  const pct = Math.round((correctCount / total) * 100);
  const color = pct === 100 ? 'var(--green)' : pct >= 70 ? 'var(--amber)' : 'var(--red)';
  const rows = cards.map((card, i) => {
    const ok = results[i];
    const cls = ok ? 'correct' : 'incorrect';
    const icon = ok ? '✓' : '✕';
    const iconColor = ok ? 'var(--green)' : 'var(--red)';
    const itemsHtml = card.items.map(t => `<li>${escapeHtml(t)}</li>`).join('');
    return `<li class="report-item ${cls}">
      <div class="report-header"><span class="icon" style="color:${iconColor};">${icon}</span><span>${i + 1}. ${escapeHtml(card.title)}</span></div>
      <ul class="check-list">${itemsHtml}</ul>
    </li>`;
  }).join('');
  app.innerHTML = `
    <div class="card">
      <div class="eyebrow">Report Card</div>
      <div style="margin-bottom:6px;">
        <span class="score-badge" style="background:${color}22;color:${color};">${correctCount}/${total} sections correct</span>
      </div>
      <ul class="report-list">${rows}</ul>
      <div class="btnrow" style="margin-top:16px;">
        <button class="btn primary" id="btnRestart">Start over</button>
      </div>
    </div>
  `;
  document.getElementById('btnRestart').addEventListener('click', () => {
    idx = 0;
    results = new Array(cards.length).fill(null);
    revealed = false;
    awaitingNext = false;
    finished = false;
    render();
  });
}

document.getElementById('btnEditMode').addEventListener('click', () => {
  editing = !editing;
  finished = false;
  revealed = false;
  awaitingNext = false;
  render();
});

render();
</script>
</body>
</html>
